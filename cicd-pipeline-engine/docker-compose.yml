services:
  # ── PostgreSQL (pipelines, runs, logs) ─────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: cicd_postgres
    environment:
      POSTGRES_USER: cicd
      POSTGRES_PASSWORD: cicd123
      POSTGRES_DB: cicddb
    ports:
      - "5432:5432"
    volumes:
      - cicd_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cicd -d cicddb"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Redis (Celery broker + WebSocket log pub/sub) ──────────────────
  redis:
    image: redis:7-alpine
    container_name: cicd_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── FastAPI app ────────────────────────────────────────────────────
  api:
    build: .
    container_name: cicd_api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      # Inside the compose network, services are reached by service name
      DATABASE_URL: postgresql://cicd:cicd123@postgres:5432/cicddb
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Celery worker (builds images → needs the host Docker socket) ───
  worker:
    build: .
    container_name: cicd_worker
    command: celery -A app.tasks.celery_app worker --loglevel=info -Q pipelines -c 2
    env_file: .env
    environment:
      DATABASE_URL: postgresql://cicd:cicd123@postgres:5432/cicddb
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    volumes:
      - .:/app
      # SECURITY: gives the worker root-equivalent control of the host's Docker.
      # Only run this on a machine you trust, against repos you trust.
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Flower (Celery monitor) ────────────────────────────────────────
  flower:
    build: .
    container_name: cicd_flower
    command: celery -A app.tasks.celery_app flower --port=5555
    ports:
      - "5555:5555"
    env_file: .env
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    depends_on:
      - redis

volumes:
  cicd_pgdata:
